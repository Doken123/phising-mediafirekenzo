<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>403 - Akses Ditolak</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;margin:0;background:#f8f9fa;
    font-family:Arial,Helvetica,sans-serif;padding:20px;
    -webkit-text-size-adjust:100%;
}
.card{
    background:#fff;padding:60px 80px;border-radius:20px;
    box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center;
    border:1px solid #eee;max-width:480px;width:100%;
}
.code{
    font-size:96px;font-weight:800;color:#e63946;
    letter-spacing:-4px;line-height:1;
}
.line{
    width:70px;height:5px;background:#ffc9ce;
    border-radius:3px;margin:22px auto;
}
h2{
    font-size:26px;color:#1a1a2e;margin:0 0 14px;font-weight:700;
}
p{
    color:#9aa0a6;font-size:15px;margin:0;
}
@media(max-width:480px){
    .card{padding:40px 28px;}
    .code{font-size:72px;}
    h2{font-size:22px;}
}
</style>
</head>
<body>
    <div class="card">
        <div class="code">403</div>
        <div class="line"></div>
        <h2>Akses Ditolak</h2>
        <p>IP Anda telah diblokir.</p>
    </div>
</body>
</html>
