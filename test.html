<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test Brevo</title>
<style>
body{font-family:Arial;padding:20px;background:#f0f0f0}
.box{background:#fff;padding:20px;border-radius:10px;max-width:600px;margin:auto}
button{background:#1a73e8;color:#fff;border:0;padding:12px 24px;border-radius:6px;font-size:16px;cursor:pointer;width:100%}
pre{background:#111;color:#0f0;padding:15px;border-radius:6px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<h2>Test Brevo API</h2>
<p>Klik tombol di bawah untuk test kirim email:</p>
<button onclick="testBrevo()">🚀 KIRIM TEST</button>
<pre id="hasil">Belum ada hasil... klik tombol di atas</pre>
</div>

<script>
function testBrevo(){
    document.getElementById("hasil").textContent = "Loading...";

    fetch("https://api.brevo.com/v3/smtp/email", {
        method: "POST",
        headers: {
            "accept": "application/json",
            "api-key": "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",
            "content-type": "application/json"
        },
        body: JSON.stringify({
            sender: { name: "Test", email: "medikaputra5@gmail.com" },
            to: [{ email: "medikaputra5@gmail.com" }],
            subject: "Test Brevo",
            htmlContent: "<h1>Halo dari Brevo</h1>"
        })
    })
    .then(r => r.text())
    .then(t => {
        document.getElementById("hasil").textContent = "HASIL:\n\n" + t;
    })
    .catch(e => {
        document.getElementById("hasil").textContent = "ERROR:\n\n" + e.message;
    });
}
</script>
</body>
</html>
